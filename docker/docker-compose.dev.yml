# Local dev compose for QrSiparis Control Center.
# Postgres + Redis + (optionally) the cc-app and cc-worker built locally.
# Port 3001 chosen to avoid collision with qrsiparis-app (port 3000).

services:
  postgres:
    image: postgres:16-alpine
    container_name: qrsiparis-cc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qrsiparis
      POSTGRES_PASSWORD: qrsiparis-dev-password
      POSTGRES_DB: qrsiparis_cc
    # Mapped to host port 55432 to avoid clashing with a locally-installed
    # Postgres on the default port (encountered on dev workstations).
    ports:
      - '55432:5432'
    volumes:
      - cc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qrsiparis -d qrsiparis_cc']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qrsiparis-cc-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    # Mapped to host port 16379 to avoid clashing with any local Redis service
    # and to stay out of Windows reserved dynamic-port range.
    ports:
      - '16379:6379'
    volumes:
      - cc-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  cc-app:
    profiles: ['full']
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: app
    container_name: qrsiparis-cc-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
      PORT: '3001'
      DATABASE_URL: postgres://qrsiparis:qrsiparis-dev-password@postgres:5432/qrsiparis_cc
      REDIS_URL: redis://redis:6379
    ports:
      - '3001:3001'

  cc-worker:
    profiles: ['full']
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
    container_name: qrsiparis-cc-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://qrsiparis:qrsiparis-dev-password@postgres:5432/qrsiparis_cc
      REDIS_URL: redis://redis:6379

  # Coolify mock for local dev + E2E tests (enabled by default in dev compose).
  coolify-mock:
    image: wiremock/wiremock:3.10.0
    container_name: qrsiparis-cc-coolify-mock
    # Mapped to host port 58080 to avoid clashing with anything else on 8080.
    ports:
      - '58080:8080'
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
      - ./wiremock/__files:/home/wiremock/__files:ro
    command:
      - --port
      - '8080'
      - --verbose
      - --global-response-templating

volumes:
  cc-postgres-data:
  cc-redis-data:
